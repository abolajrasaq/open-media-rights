name: .NET validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/OpenMediaRights/OpenMediaRights.csproj -c Release
      - run: dotnet run --project tests/OpenMediaRights.SmokeTests/OpenMediaRights.SmokeTests.csproj -c Release
      - run: dotnet pack src/OpenMediaRights/OpenMediaRights.csproj -c Release